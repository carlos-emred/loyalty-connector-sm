# Servidor virtual del conector de SalesManago.
#
# Convive con nginx-loyalty.conf en la misma instancia. Aquel es el
# default_server; este solo atiende su propio nombre. Ajustar server_name al
# dominio definitivo.

# Límite de peticiones para el único endpoint público, ejecutar_compra.php,
# que no pide credenciales (lo llama un webhook de SalesManago). 120 por
# minuto por IP, con margen de 60 para ráfagas: las llamadas legítimas llegan
# todas desde las pocas IP de SalesManago, así que el límite no puede ser muy
# bajo. Por encima, nginx responde 429 sin llegar a PHP. La zona se declara
# aquí porque los ficheros de conf.d se incluyen en el contexto http.
limit_req_zone $binary_remote_addr zone=sm_compras:10m rate=120r/m;

server {
    listen 80;
    server_name salesmanago-pre.biemred.com;

    root /opt/salesmanago/repo/public;

    autoindex off;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }

    location = /webhooks/ejecutar_compra.php {
        limit_req zone=sm_compras burst=60 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/salesmanago.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/salesmanago.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    access_log /var/log/nginx/salesmanago.access.log;
    error_log  /var/log/nginx/salesmanago.error.log;
}
