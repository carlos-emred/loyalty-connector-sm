# Servidor virtual del conector de SalesManago.
#
# Convive con nginx-loyalty.conf en la misma instancia. Aquel es el
# default_server; este solo atiende su propio nombre. Ajustar server_name al
# dominio definitivo.

server {
    listen 80;
    server_name salesmanago-pre.biemred.com;

    root /opt/salesmanago/repo/public;

    autoindex off;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/salesmanago.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    access_log /var/log/nginx/salesmanago.access.log;
    error_log  /var/log/nginx/salesmanago.error.log;
}
