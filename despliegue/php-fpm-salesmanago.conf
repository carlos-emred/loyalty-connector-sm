; Pool propio para el conector de SalesManago.
;
; Separado del pool loyalty para que cada conector lea solo su .env: el
; usuario salesmanago no puede leer /opt/loyalty/.env ni al revés.

[salesmanago]
user = salesmanago
group = salesmanago

listen = /run/php-fpm/salesmanago.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

catch_workers_output = yes
php_admin_value[error_log] = /var/log/salesmanago/error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
